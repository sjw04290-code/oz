<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>계산기</title>
  <style>
    :root{
      --bg:#0f172a;         /* slate-900 */
      --panel:#111827;      /* gray-900 */
      --key:#1f2937;        /* gray-800 */
      --key-acc:#0ea5e9;    /* sky-500 */
      --key-op:#f59e0b;     /* amber-500 */
      --text:#e5e7eb;       /* gray-200 */
      --muted:#94a3b8;      /* slate-400 */
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; padding:24px; background:linear-gradient(145deg,#0b1222,#0f172a);
      color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,Helvetica,Arial,sans-serif;
      min-height:100svh; display:grid; place-items:center;
    }
    .calc{
      width:min(420px, 92vw); background:var(--panel); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden; border:1px solid rgba(255,255,255,.06);
    }
    .display{
      padding:24px; text-align:right; background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    }
    .prev{font-size:16px; color:var(--muted); min-height:22px; word-wrap:anywhere}
    .curr{font-size:40px; line-height:1.2; font-weight:700; word-wrap:anywhere}

    .keys{
      display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; padding:16px; background:rgba(255,255,255,.02);
    }
    button{
      border:0; border-radius:16px; padding:18px 14px; font-size:20px; font-weight:600; color:var(--text);
      background:var(--key); cursor:pointer; box-shadow:inset 0 -3px rgba(255,255,255,.04);
      transition:transform .04s ease, filter .2s ease, background .2s ease;
      user-select:none;
    }
    button:active{ transform:translateY(1px); }
    button.op{ background:linear-gradient(180deg, #f59e0b, #d97706); color:#0b0b0b; }
    button.acc{ background:linear-gradient(180deg, #38bdf8, #0ea5e9); color:#0b0b0b; }
    button.equal{ background:linear-gradient(180deg, #22c55e, #16a34a); color:#0b0b0b; grid-column: span 2; }
    button.wide{ grid-column: span 2; }

    .footer{font-size:12px; color:var(--muted); text-align:center; padding:8px 16px 18px}
    .kbd{padding:2px 6px; border-radius:6px; background:#0b1222; border:1px solid rgba(255,255,255,.08); font-family:ui-monospace,Menlo,monospace}
  </style>
</head>
<body>
  <main class="calc" role="application" aria-label="간단 계산기">
    <section class="display" aria-live="polite">
      <div id="prev" class="prev"></div>
      <div id="curr" class="curr">0</div>
    </section>

    <section class="keys">
      <button class="acc" data-action="clear" aria-label="모두 지우기">AC</button>
      <button class="acc" data-action="delete" aria-label="한 글자 지우기">DEL</button>
      <button class="acc" data-action="percent" aria-label="백분율">%</button>
      <button class="op" data-op="/" aria-label="나누기">÷</button>

      <button data-num>7</button>
      <button data-num>8</button>
      <button data-num>9</button>
      <button class="op" data-op="*" aria-label="곱하기">×</button>

      <button data-num>4</button>
      <button data-num>5</button>
      <button data-num>6</button>
      <button class="op" data-op="-" aria-label="빼기">−</button>

      <button data-num>1</button>
      <button data-num>2</button>
      <button data-num>3</button>
      <button class="op" data-op="+" aria-label="더하기">+</button>

      <button class="wide" data-action="sign" aria-label="부호 전환">±</button>
      <button data-num>0</button>
      <button data-action="dot">.</button>
      <button class="equal" data-action="equals" aria-label="계산 결과">=</button>
    </section>

    <div class="footer">키보드 지원: <span class="kbd">0–9</span>, <span class="kbd">+ − × ÷</span>, <span class="kbd">.</span>, <span class="kbd">Enter</span>, <span class="kbd">Backspace</span>, <span class="kbd">Esc</span>, <span class="kbd">%</span></div>
  </main>

  <script>
    const prevEl = document.getElementById('prev');
    const currEl = document.getElementById('curr');

    const state = {
      current: '0',
      previous: '',
      operator: null,
      justEvaluated: false,
    };

    const format = (str) => {
      // 소수점 제외한 부분만 천단위 구분
      if (!str) return '0';
      if (str === '-') return '-';
      const [i, d] = str.split('.');
      const int = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return d ? `${int}.${d}` : int;
    };

    function updateDisplay(){
      currEl.textContent = format(state.current);
      prevEl.textContent = state.previous;
    }

    function inputDigit(d){
      if (state.justEvaluated){
        state.current = d; state.justEvaluated = false; updateDisplay(); return;
      }
      if (state.current === '0') state.current = d; else state.current += d;
      updateDisplay();
    }

    function inputDot(){
      if (state.justEvaluated){ state.current = '0.'; state.justEvaluated = false; updateDisplay(); return; }
      if (!state.current.includes('.')) state.current += '.';
      updateDisplay();
    }

    function chooseOperator(op){
      if (state.operator && !state.justEvaluated){
        // 연산자 연속 입력 시 현재까지 계산
        compute();
      }
      state.operator = op;
      state.previous = `${format(state.current)} ${op}`;
      state.current = '0';
      state.justEvaluated = false;
      updateDisplay();
    }

    function clearAll(){
      state.current = '0';
      state.previous = '';
      state.operator = null;
      state.justEvaluated = false;
      updateDisplay();
    }

    function del(){
      if (state.justEvaluated){ clearAll(); return; }
      if (state.current.length <= 1 || (state.current.length === 2 && state.current.startsWith('-'))){
        state.current = '0';
      } else {
        state.current = state.current.slice(0,-1);
      }
      updateDisplay();
    }

    function toggleSign(){
      if (state.current === '0') return;
      state.current = state.current.startsWith('-') ? state.current.slice(1) : '-' + state.current;
      updateDisplay();
    }

    function percent(){
      const n = parseFloat(state.current);
      if (isNaN(n)) return;
      state.current = (n / 100).toString();
      updateDisplay();
    }

    function compute(){
      if (state.operator === null) return;
      const a = parseFloat(state.previous.replace(/[,]/g, '').split(' ')[0]);
      const b = parseFloat(state.current);
      if (isNaN(a) || isNaN(b)) return;
      let r = 0;
      switch(state.operator){
        case '+': r = a + b; break;
        case '-': r = a - b; break;
        case '*': r = a * b; break;
        case '/': r = b === 0 ? NaN : a / b; break;
        default: return;
      }
      state.current = String(r);
      state.previous = '';
      state.operator = null;
      state.justEvaluated = true;
      updateDisplay();
    }

    // 버튼 이벤트
    document.querySelector('.keys').addEventListener('click', (e)=>{
      const t = e.target.closest('button');
      if (!t) return;
      if (t.hasAttribute('data-num')){ inputDigit(t.textContent.trim()); return; }
      if (t.hasAttribute('data-op')){ chooseOperator(t.getAttribute('data-op')); return; }
      const act = t.getAttribute('data-action');
      if (act === 'dot') return inputDot();
      if (act === 'clear') return clearAll();
      if (act === 'delete') return del();
      if (act === 'equals') return compute();
      if (act === 'sign') return toggleSign();
      if (act === 'percent') return percent();
    });

    // 키보드 지원
    window.addEventListener('keydown', (e)=>{
      const key = e.key;
      if (/^\d$/.test(key)) return inputDigit(key);
      if (key === '.') return inputDot();
      if (key === '+' || key === '-' || key === '*' || key === '/') return chooseOperator(key);
      if (key === 'Enter' || key === '=') return compute();
      if (key === 'Backspace') return del();
      if (key === 'Escape') return clearAll();
      if (key === '%') return percent();
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>누르는 계산기 (클릭 전용)</title>
  <style>

    .wrap{width:min(360px,94vw);background:#111827;border:1px solid rgba(255,255,255,.06);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
    .screen{padding:18px;text-align:right;font-size:36px;min-height:52px;background:rgba(255,255,255,.02)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:rgba(255,255,255,.02)}
    button{border:0;border-radius:12px;padding:16px 12px;font-size:18px;font-weight:700;color:#e5e7eb;background:#1f2937;cursor:pointer}
    button.op{background:#334155}
    button.eq{background:#16a34a;color:#08110a;grid-column:span 2}
    button.wide{grid-column:span 2}
  </style>
</head>
<body>

      <button data-num>5</button>
      <button data-num>6</button>
      <button class="op" data-op="-">−</button>

      <button data-num>1</button>
      <button data-num>2</button>
      <button data-num>3</button>
      <button class="op" data-op="+">+</button>

      <button class="wide" data-act="sign">±</button>
      <button data-num>0</button>
      <button data-act="dot">.</button>
      <button class="eq" data-act="eq">=</button>
    </div>
  </div>

  <script>
    // 최소 상태
    let cur = '0';
    let op = null; // '+', '-', '*', '/'
    let prev = null; // 이전 값 (number)
    let just = false; // 방금 계산했는지

    const scr = document.getElementById('scr');
    const pad = document.getElementById('pad');

    const fmt = (s)=>{
      const [i,d] = s.split('.');
      const int = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return d ? `${int}.${d}` : int;
    };
    const paint = ()=> scr.textContent = fmt(cur);

    const setNum = (n)=>{
      if (just){ cur = n; just = false; return paint(); }
      if (cur === '0') cur = n; else cur += n; paint();
