<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>누르는 계산기 (클릭 전용)</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, Apple SD Gothic Neo, Noto Sans KR, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }
      .wrap {
        width: min(360px, 94vw);
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        position: relative;
      }
      .screen {
        padding: 18px;
        text-align: right;
        font-size: 36px;
        min-height: 52px;
        background: rgba(255, 255, 255, 0.02);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 12px;
        background: #facc15;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 16px 12px;
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        background: #fde047;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
      }
      button.op {
        background: #fbbf24;
      }
      button.eq {
        background: #16a34a;
        color: #08110a;
        grid-column: span 2;
      }
      button.wide {
        grid-column: span 2;
      }

      /* 버튼 눌림 효과 (유지) */
      button.active {
        background: #d97706;
        color: #fff;
      }

      /* 작은 원 3개 */
      .circles {
        position: absolute;
        top: 10px;
        left: 12px;
        display: flex;
        gap: 8px;
      }
      .circle {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .red {
        background: #ef4444;
      }
      .yellow {
        background: #f59e0b;
      }
      .green {
        background: #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="wrap" role="application" aria-label="누르는 계산기">
      <div class="circles">
        <div class="circle red"></div>
        <div class="circle yellow"></div>
        <div class="circle green"></div>
      </div>
      <div id="scr" class="screen">0</div>
      <div class="grid" id="pad">
        <button data-act="ac" class="wide">AC</button>
        <button data-act="del">DEL</button>
        <button class="op" data-op="/">÷</button>

        <button data-num>7</button>
        <button data-num>8</button>
        <button data-num>9</button>
        <button class="op" data-op="*">×</button>

        <button data-num>4</button>
        <button data-num>5</button>
        <button data-num>6</button>
        <button class="op" data-op="-">−</button>

        <button data-num>1</button>
        <button data-num>2</button>
        <button data-num>3</button>
        <button class="op" data-op="+">+</button>

        <button class="wide" data-act="sign">±</button>
        <button data-num>0</button>
        <button data-act="dot">.</button>
        <button class="eq" data-act="eq">=</button>
      </div>
    </div>

    <script>
      let cur = "0";
      let op = null;
      let prev = null;
      let just = false;

      const scr = document.getElementById("scr");
      const pad = document.getElementById("pad");

      const paint = () => {
        scr.textContent = cur;
      };

      const setNum = (n, btn) => {
        if (just) {
          cur = n;
          just = false;
        } else if (cur === "0") cur = n;
        else cur += n;
        paint();
        highlight(btn);
      };
      const setDot = (btn) => {
        if (!cur.includes(".")) {
          cur += ".";
          paint();
          highlight(btn);
        }
      };
      const setSign = (btn) => {
        if (cur !== "0") {
          cur = cur.startsWith("-") ? cur.slice(1) : "-" + cur;
          paint();
          highlight(btn);
        }
      };

      const choose = (nextOp, btn) => {
        if (op !== null && !just) {
          evalNow();
        }
        prev = parseFloat(cur);
        op = nextOp;
        cur = "0";
        just = false;
        paint();
        highlight(btn);
      };

      const clearAll = (btn) => {
        cur = "0";
        op = null;
        prev = null;
        just = false;
        paint();
        highlight(btn);
      };
      const del = (btn) => {
        if (just) return clearAll(btn);
        if (cur.length <= 1 || (cur.length === 2 && cur.startsWith("-")))
          cur = "0";
        else cur = cur.slice(0, -1);
        paint();
        highlight(btn);
      };

      function evalNow(btn) {
        if (op === null || prev === null) return;
        const a = prev;
        const b = parseFloat(cur);
        let r = 0;
        switch (op) {
          case "+":
            r = a + b;
            break;
          case "-":
            r = a - b;
            break;
          case "*":
            r = a * b;
            break;
          case "/":
            r = b === 0 ? NaN : a / b;
            break;
        }
        cur = String(r);
        op = null;
        prev = null;
        just = true;
        paint();
        if (btn) highlight(btn);
      }

      function highlight(btn) {
        document
          .querySelectorAll("button")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      }

      pad.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        if (btn.hasAttribute("data-num"))
          return setNum(btn.textContent.trim(), btn);
        if (btn.classList.contains("op"))
          return choose(btn.getAttribute("data-op"), btn);
        const act = btn.getAttribute("data-act");
        if (act === "ac") return clearAll(btn);
        if (act === "del") return del(btn);
        if (act === "dot") return setDot(btn);
        if (act === "sign") return setSign(btn);
        if (act === "eq") return evalNow(btn);
      });
    </script>
  </body>
</html>
